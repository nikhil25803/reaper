[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "reaper"
dynamic = ["version"]
description = "A language-agnostic tool for dead code detection and analysis."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["dead-code", "static-analysis", "developer-tools", "cli"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "rich>=13.8,<16",
  "typer>=0.16,<1",
]

[project.scripts]
reaper = "reaper.main:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.11,<1",
]

[tool.hatch.version]
path = "src/reaper/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
