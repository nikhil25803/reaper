name: Llama

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install Reaper and Graphify
        run: |
          uv sync --locked
          uv pip install graphifyy==0.9.95

      - name: Scan repository
        run: uv run --no-sync reaper --scan .

      - name: Download test model
        run: |
          mkdir -p "$RUNNER_TEMP/reaper-models"
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/reaper-models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf" \
            https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf

      - name: Start llama.cpp server
        run: |
          docker run --detach --rm \
            --name reaper-llama \
            --publish 8080:8080 \
            --volume "$RUNNER_TEMP/reaper-models:/models:ro" \
            ghcr.io/ggml-org/llama.cpp:server \
            --model /models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf \
            --host 0.0.0.0 \
            --port 8080
          for _ in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs reaper-llama
          exit 1

      - name: Analyze ranked callables
        run: uv run --no-sync reaper analyze . --limit 100

      - name: Publish report summary
        run: |
          cat reaper-analysis/reaper-report.md
          cat reaper-analysis/reaper-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        uses: actions/upload-artifact@v7
        with:
          name: reaper-analysis-report
          path: |
            reaper-analysis/reaper-report.json
            reaper-analysis/reaper-report.md
          retention-days: 7

      - name: Show llama.cpp logs on failure
        if: failure()
        run: docker logs reaper-llama
