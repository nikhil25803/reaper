name: CI

on:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv and Python
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Build distributions
        run: uv build

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag reaper .

      - name: Test image
        run: |
          docker run --rm reaper --help
          docker run --rm reaper --version
          docker run --rm reaper --check graphify
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            reaper --scan /workspace
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env HOME=/tmp \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            reaper graph candidates /workspace --list --limit 5 --page 1

      - name: Validate generated graph
        run: >-
          python3 -c "import json;
          from pathlib import Path;
          graph = json.loads(Path('reaper-analysis/graphify-out/graph.json').read_text());
          assert graph['nodes'];
          assert isinstance(graph.get('links'), list)"
